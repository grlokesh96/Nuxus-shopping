apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nuxus-shopping-ingress
  namespace: nuxus-shopping
spec:
  ingressClassName: nginx
  rules:
    - host: nuxus-shopping.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nuxus-shopping-service
                port:
                  number: 80
