apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-nuxus-ingress
  namespace: node-nuxus
spec:
  ingressClassName: nginx
  rules:
    - host: node-nuxus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-nuxus-service
                port:
                  number: 80
