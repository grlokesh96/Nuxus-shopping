apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nuxus-shopping-hpa
  namespace: nuxus-shopping
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nuxus-shopping
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
