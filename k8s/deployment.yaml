apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-nuxus
  labels:
    app: nuxus-shopping
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nuxus-shopping
  template:
    metadata:
      labels:
        app: nuxus-shopping
    spec:
      containers:
        - name: nuxus-shopping
          image: lokeshzenbook/nuxus-shopping:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
