apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-nuxus
  labels:
    app: node-nuxus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-nuxus
  template:
    metadata:
      labels:
        app: node-nuxus
    spec:
      containers:
        - name: node-nuxus
          image: lokeshzenbook/node-nuxus:latest
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
