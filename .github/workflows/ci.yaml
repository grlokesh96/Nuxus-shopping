name: Build, Scan & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: lokeshzenbook/node-nuxus
  ACR_IMAGE_NAME: node-nuxus

jobs:

  # ---------- Stage 1: Build & Test ----------
  build:
    name: "Stage 1: Build Application"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1

  # ---------- Stage 1b: Check ACR credentials ----------
  check-acr-credentials:
    name: "Stage 1b: Check ACR Credentials"
    runs-on: ubuntu-latest
    outputs:
      acr-enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verify ACR secrets are provided
        id: check
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_LOGIN_SERVER" ] && [ -n "$ACR_USERNAME" ] && [ -n "$ACR_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ACR credentials found: ACR build and push enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ACR credentials not provided: ACR push will be skipped"
          fi

  # ---------- Stage 2: Security Scans (parallel) ----------
  secret-scan:
    name: "Stage 2a: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-scan:
    name: "Stage 2b: Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy FS SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-results.sarif
          retention-days: 7
          if-no-files-found: ignore

  semgrep-scan:
    name: "Stage 2c: Semgrep SAST Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        run: |
          python3 -m pip install --user --break-system-packages semgrep
          export PATH="$PATH:$HOME/.local/bin"
          semgrep --version
          semgrep scan --config auto --sarif-output semgrep.sarif || true

      - name: Upload Semgrep SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 2

  codeql-scan:
    name: "Stage 2d: GitHub CodeQL Analysis"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  eslint-scan:
    name: "Stage 2e: ESLint Code Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ESLint tooling
        run: npm install --no-save eslint @eslint/js globals typescript-eslint

      - name: Run ESLint scan
        run: |
          npx eslint . --format json --output-file eslint-report.json --no-error-on-unmatched-pattern || true

      - name: Upload ESLint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  hadolint-scan:
    name: "Stage 2f: Hadolint Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-report.sarif
          no-fail: true

      - name: Upload Hadolint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-report.sarif
          retention-days: 7

  # ---------- Stage 2g: Kubernetes Security Audit (CIS) ----------
  kube-bench-scan:
    name: "Stage 2g: Kubernetes Security Audit (Kube-bench)"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    env:
      KUBE_BENCH_IMAGE: docker.io/aquasec/kube-bench:v0.10.6   # pin; bump after checking releases
    steps:
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kube-bench

      - name: Run kube-bench as in-cluster Job
        run: |
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kube-bench
          spec:
            backoffLimit: 0
            template:
              spec:
                hostPID: true
                restartPolicy: Never
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
                containers:
                  - name: kube-bench
                    image: ${KUBE_BENCH_IMAGE}
                    command: ["kube-bench", "run", "--json"]
                    volumeMounts:
                      - { name: var-lib-etcd, mountPath: /var/lib/etcd, readOnly: true }
                      - { name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true }
                      - { name: etc-systemd, mountPath: /etc/systemd, readOnly: true }
                      - { name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true }
                      - { name: usr-bin, mountPath: /usr/local/mount-from-host/bin, readOnly: true }
                volumes:
                  - { name: var-lib-etcd, hostPath: { path: /var/lib/etcd } }
                  - { name: var-lib-kubelet, hostPath: { path: /var/lib/kubelet } }
                  - { name: etc-systemd, hostPath: { path: /etc/systemd } }
                  - { name: etc-kubernetes, hostPath: { path: /etc/kubernetes } }
                  - { name: usr-bin, hostPath: { path: /usr/bin } }
          EOF

          if ! kubectl wait --for=condition=complete job/kube-bench --timeout=180s; then
            kubectl describe job/kube-bench || true
            kubectl logs job/kube-bench || true
            exit 1
          fi
          kubectl logs job/kube-bench > kube-bench-report.json

      - name: Summarize results
        if: always()
        run: |
          if [ -s kube-bench-report.json ]; then
            {
              echo "### Kube-bench (CIS) results"
              jq -r '.Totals | "- PASS: \(.total_pass)\n- FAIL: \(.total_fail)\n- WARN: \(.total_warn)\n- INFO: \(.total_info)"' kube-bench-report.json
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload Kube-bench report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kube-bench-report
          path: kube-bench-report.json
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Stage 2i: Kubernetes Manifest Security Scan (Kubescape) ----------
  kubescape-scan:
    name: "Stage 2i: Kubernetes Manifest Scan (Kubescape)"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Kubescape
        run: |
          curl -s https://raw.githubusercontent.com/kubescape/kubescape/master/install.sh | /bin/bash
          echo "$HOME/.kubescape/bin" >> "$GITHUB_PATH"

      - name: Run Kubescape scan
        run: |
          kubescape version
          # Change "." to your manifests/Helm path (e.g. k8s/) to narrow the scan
          kubescape scan framework nsa,mitre . \
            --format json --output kubescape-report.json \
            --verbose || true
          kubescape scan framework nsa,mitre . \
            --format sarif --output kubescape.sarif || true

      - name: Summarize results
        if: always()
        run: |
          if [ -s kubescape-report.json ]; then
            {
              echo "### Kubescape results"
              jq -r '"- Compliance score: \(.summaryDetails.complianceScore // "n/a")%\n- Failed controls: \(.summaryDetails.controls | map(select(.status.status=="failed")) | length)"' kubescape-report.json
            } >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload Kubescape reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubescape-report
          path: |
            kubescape-report.json
            kubescape.sarif
          retention-days: 7
          if-no-files-found: ignore

  trufflehog-scan:
    name: "Stage 2h: TruffleHog Secret Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      # Scans the full git history. Fails the job on detected secrets; report is uploaded either way.
      - name: Run TruffleHog scan
        run: |
          trufflehog git "file://$PWD" \
            --results=verified,unknown \
            --json \
            --fail \
            --no-update > trufflehog-report.json

      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Stage 3: Docker Build, SBOM & Image Scan ----------
  docker-build-scan:
    name: "Stage 3: Build, SBOM & Scan Docker Image"
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - trufflehog-scan
      - dependency-scan
      - semgrep-scan
      - codeql-scan
      - eslint-scan
      - hadolint-scan
      - kube-bench-scan
      - kubescape-scan
      - check-acr-credentials
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_ENABLED: ${{ needs.check-acr-credentials.outputs.acr-enabled }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: |
          TAGS="-t $DOCKERHUB_IMAGE:$IMAGE_TAG -t $DOCKERHUB_IMAGE:latest"
          if [ "$ACR_ENABLED" = "true" ]; then
            TAGS="$TAGS -t $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:$IMAGE_TAG -t $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:latest"
          fi
          docker build $TAGS .

      - name: Generate SBOM (SPDX format via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.image-tag }}
          format: spdx-json
          output-file: sbom-${{ steps.meta.outputs.image-tag }}.spdx.json

      - name: Generate SBOM (CycloneDX format via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.image-tag }}
          format: cyclonedx-json
          output-file: sbom-${{ steps.meta.outputs.image-tag }}.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-${{ steps.meta.outputs.image-tag }}.spdx.json
            sbom-${{ steps.meta.outputs.image-tag }}.cdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.image-tag }}
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy image SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 7
          if-no-files-found: ignore

      # Only includes ACR tags when ACR credentials were provided
      - name: Save Docker image as tarball
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image-tag }}
        run: |
          IMAGES="$DOCKERHUB_IMAGE:$IMAGE_TAG $DOCKERHUB_IMAGE:latest"
          if [ "$ACR_ENABLED" = "true" ]; then
            IMAGES="$IMAGES $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:$IMAGE_TAG $ACR_LOGIN_SERVER/$ACR_IMAGE_NAME:latest"
          fi
          docker save $IMAGES -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------- Stage 4a: Push to Docker Hub ----------
  push-dockerhub:
    name: "Stage 4a: Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: github.event_name != 'pull_request'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ needs.docker-build-scan.outputs.image-tag }}
          docker push ${{ env.DOCKERHUB_IMAGE }}:latest

  # # ---------- Stage 4b: Push to Azure Container Registry (non-blocking) ----------
  # # continue-on-error: a failed ACR push is reported but does not fail the workflow run.
  # push-acr:
  #   name: "Stage 4b: Push to Azure Container Registry"
  #   runs-on: ubuntu-latest
  #   needs:
  #     - docker-build-scan
  #     - check-acr-credentials
  #   if: >-
  #     github.event_name != 'pull_request' &&
  #     needs.check-acr-credentials.outputs.acr-enabled == 'true'
  #   continue-on-error: true
  #   env:
  #     ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  #   steps:
  #     - name: Download image artifact
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: docker-image

  #     - name: Load Docker image
  #       run: docker load -i image.tar

  #     - name: Login to Azure Container Registry
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ${{ secrets.ACR_LOGIN_SERVER }}
  #         username: ${{ secrets.ACR_USERNAME }}
  #         password: ${{ secrets.ACR_PASSWORD }}

  #     - name: Push image to ACR
  #       run: |
  #         docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_IMAGE_NAME }}:${{ needs.docker-build-scan.outputs.image-tag }}
  #         docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.ACR_IMAGE_NAME }}:latest

  # ---------- Stage 5: Slack & Email Notification ----------
  notify:
    name: "Stage 5: Slack & Email Notification"
    runs-on: ubuntu-latest
    needs:
      - build
      - check-acr-credentials
      - secret-scan
      - trufflehog-scan
      - dependency-scan
      - semgrep-scan
      - codeql-scan
      - eslint-scan
      - hadolint-scan
      - kube-bench-scan
      - kubescape-scan
      - docker-build-scan
      - push-dockerhub
    if: always()
    steps:
      - name: Determine pipeline status
        id: status
        env:
          R_BUILD: ${{ needs.build.result }}
          R_CHECK: ${{ needs.check-acr-credentials.result }}
          R_SECRET: ${{ needs.secret-scan.result }}
          R_TRUFFLE: ${{ needs.trufflehog-scan.result }}
          R_DEPS: ${{ needs.dependency-scan.result }}
          R_SEMGREP: ${{ needs.semgrep-scan.result }}
          R_CODEQL: ${{ needs.codeql-scan.result }}
          R_ESLINT: ${{ needs.eslint-scan.result }}
          R_HADOLINT: ${{ needs.hadolint-scan.result }}
          R_KUBEBENCH: ${{ needs.kube-bench-scan.result }}
          R_KUBESCAPE: ${{ needs.kubescape-scan.result }}
          R_DOCKER: ${{ needs.docker-build-scan.result }}
          R_HUB: ${{ needs.push-dockerhub.result }}
        run: |
          # push-acr is intentionally excluded: its failure must not fail the pipeline
          FAILED=false
          for r in "$R_BUILD" "$R_CHECK" "$R_SECRET" "$R_TRUFFLE" "$R_DEPS" \
                   "$R_SEMGREP" "$R_CODEQL" "$R_ESLINT" "$R_HADOLINT" "$R_KUBEBENCH" "$R_KUBESCAPE" "$R_DOCKER" "$R_HUB"; do
            if [ "$r" = "failure" ]; then FAILED=true; fi
          done
          if [ "$FAILED" = "true" ]; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "color=#dc3545" >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Success" >> "$GITHUB_OUTPUT"
            echo "color=#2eb886" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine ACR push status
        id: acr
        env:
          ACR_ENABLED: ${{ needs.check-acr-credentials.outputs.acr-enabled }}
          ACR_RESULT: ${{ needs.push-acr.result }}
        run: |
          if [ "$ACR_ENABLED" != "true" ]; then
            LABEL="Skipped (no credentials)"
          elif [ "$ACR_RESULT" = "success" ]; then
            LABEL="Succeeded"
          elif [ "$ACR_RESULT" = "failure" ]; then
            LABEL="Failed (non-blocking)"
          else
            LABEL="$ACR_RESULT"
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "ACR push: $LABEL"

      - name: Download all pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate pipeline report
        env:
          ACR_LABEL: ${{ steps.acr.outputs.label }}
          PIPE_STATUS: ${{ steps.status.outputs.status }}
        run: |
          mkdir -p artifacts/notification
          cat > artifacts/notification/pipeline-report.txt <<EOF
          Pipeline : ${{ github.workflow }}
          Status   : $PIPE_STATUS
          Repo     : ${{ github.repository }} (${{ github.ref_name }})
          Trigger  : ${{ github.actor }} (${{ github.event_name }})
          Commit   : ${{ github.sha }}
          ACR Push : $ACR_LABEL
          Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          EOF

      - name: Send Slack notification with artifacts
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ steps.status.outputs.status }}*: `${{ github.workflow }}`\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Triggered by:* ${{ github.actor }} (${{ github.event_name }})\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*ACR Push:* ${{ steps.acr.outputs.label }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Artifacts:* semgrep-sarif, hadolint-report, kube-bench-report, kubescape-report, trufflehog-report, eslint-report.json, sbom-reports (SPDX + CycloneDX), trivy-fs-sarif, trivy-image-sarif, app-build, docker-image\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts|Download artifacts>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Build email attachment list (all generated reports)
        id: attachments
        run: |
          # Every file downloaded from the pipeline, except the two large artifacts:
          #   app-build    = the whole repo
          #   docker-image = image.tar, too big for Gmail's 25 MB limit
          files=""
          total=0
          while IFS= read -r f; do
            files="$files,$f"
            total=$(( total + $(stat -c%s "$f") ))
          done < <(find artifacts \
                     \( -path artifacts/app-build -o -path artifacts/docker-image \) -prune \
                     -o -type f -print | sort)
          files="${files#,}"

          echo "Attaching files:"
          echo "$files" | tr ',' '\n'
          echo "Total size: $(( total / 1024 )) KB"
          if [ "$total" -gt 24000000 ]; then
            echo "::warning::Attachments exceed ~24 MB; Gmail may reject this email"
          fi

          echo "list=$files" >> "$GITHUB_OUTPUT"

      - name: Send email notification with artifacts
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.status }} - ${{ github.workflow }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          attach: ${{ steps.attachments.outputs.list }}
          html_body: |
            <h3>${{ steps.status.outputs.status }}: ${{ github.workflow }}</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }} (${{ github.event_name }})</p>
            <p><b>Commit:</b> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><b>ACR Push:</b> ${{ steps.acr.outputs.label }}</p>
            <p><b>Run logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p><b>Attached reports:</b> TruffleHog JSON, Trivy FS and image SARIF, Semgrep SARIF, ESLint JSON, Hadolint SARIF, Kube-bench JSON, Kubescape JSON + SARIF, SBOM (SPDX + CycloneDX) and the pipeline report.<br/>
            <b>Not attached (too large):</b> app-build and docker-image. Get them here:<br/>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts">Download all artifacts</a></p>
